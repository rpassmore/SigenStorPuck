; SigenStorPuck — firmware for the Guition ESP32-4848S040.
;
; Migrated from the Waveshare ESP32-S3-Touch-AMOLED-1.75 ([env:puck], removed).
; See MIGRATION_GUIDE.md for exactly what changed in src/display.cpp,
; src/touch.cpp, src/device/power.cpp and src/device/buttons.cpp, and what
; functionality (device battery indicator, all PWR/BOOT gestures) was
; necessarily dropped along with the hardware that implemented it.
;
; Environments (see docs/PLAN.md §B1):
;   guition   Firmware for the Guition ESP32-4848S040
;   puck      1.75" round board (466x466), USB flash — the default
;   puck241   2.41" landscape board (600x450), USB flash
;   sim       SDL desktop build — needs SDL2 (brew install sdl2)
;
; puck and puck241 share everything in [puck_base]; they differ only by the
; board profile (board_config.h dispatches on -D PUCK_BOARD_2P41) and, once the
; 2.41 backends land, the display/touch/UI source they compile.
;
; Screen work belongs in sim: a second-long edit-run loop instead of a flash
; cycle (§B5). All environments share src/ except for the hardware backends.

[platformio]
default_envs = guition

[env:guition]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Same flash/PSRAM combination as the old board — 16 MB QIO flash, 8 MB OPI
; PSRAM — so these five lines are unchanged.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D PUCK_BOARD_GUITION
  -D BOARD_HAS_PSRAM
  ; ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT REMOVED: on this board, ROM
  ; boot messages and ESP-IDF's own internal logging (e.g. Preferences.cpp's
  ; log_e()) showed up on the monitor but nothing from our own Serial.print()
  ; calls ever did, across every capture — the signature of Serial being
  ; routed over native USB-OTG pins while the monitor is actually wired to a
  ; UART bridge (CH340 or similar). Without these flags, Serial falls back to
  ; the standard hardware UART0, which is what the ROM messages and internal
  ; logging were already using. If your board *does* use native USB and this
  ; makes the monitor go silent instead, put the two flags back:
  ;   -D ARDUINO_USB_MODE=1
  ;   -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  -I src
build_src_filter = +<*> -<sim/> -<display_sh8601.cpp> -<touch_ft6336.cpp> -<ui_landscape/>

lib_deps =
  lvgl/lvgl@8.4.0
  moononournation/GFX Library for Arduino@1.6.4
  bblanchon/ArduinoJson@^7
  https://github.com/tzapu/WiFiManager.git#v2.0.17
  ; lewisxhe/XPowersLib REMOVED — no AXP2101 PMIC on this board; see
  ; src/device/power.cpp, now a stub.
  ; lewisxhe/SensorLib REMOVED — no CST9217; src/touch.cpp now talks to the
  ; GT911 directly over Wire, no touch library needed.

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; -----------------------------------------------------------------------------
; Desktop simulator. Untouched by this migration.
[env:sim]
platform = native
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I include
	-I src
	; Keep SDL's headers from renaming main(); sim_backend calls
	; SDL_SetMainReady() instead.
	-D SDL_MAIN_HANDLED
	!sdl2-config --cflags
	!sdl2-config --libs

; Swap the Arduino hardware backends for src/sim/. The snapshot model, the
; enrolment-URL parser and every screen are shared, which is the entire point.
; src/device/ is WiFi, NVS and HTTP — Arduino-only, so it is excluded here.
; The Arduino display/touch backends (both boards') and the landscape UI are
; excluded too — the sim previews the round board.
build_src_filter = +<*> -<main.cpp> -<display.cpp> -<touch.cpp> -<display_sh8601.cpp> -<touch_ft6336.cpp> -<device/> -<ui_landscape/>

lib_deps =
	lvgl/lvgl@8.4.0
	bblanchon/ArduinoJson@^7

; -----------------------------------------------------------------------------
; Desktop simulator for the 2.41 landscape UI: same SDL backend as [env:sim] but
; with the 2.41 board profile (600x450) and the landscape screen-set. Lets the
; landscape screens be previewed and screenshotted without a real 2.41.
;
;   pio run -e sim241 && .pio/build/sim241/program test/fixtures --shot /tmp/shots241
[env:sim241]
platform = native

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D PUCK_BOARD_2P41
	-I include
	-I src
	-I src/ui
	-D SDL_MAIN_HANDLED
	!sdl2-config --cflags
	!sdl2-config --libs

build_src_filter = +<*> -<main.cpp> -<display.cpp> -<touch.cpp>
	-<display_sh8601.cpp> -<touch_ft6336.cpp> -<device/>
	-<ui/ui.cpp>
	-<ui/screen_power.cpp> -<ui/screen_battery.cpp> -<ui/screen_solar.cpp>
	-<ui/screen_load.cpp> -<ui/screen_flows.cpp> -<ui/screen_cost.cpp>
	-<ui/screen_settings.cpp> -<ui/screen_grid.cpp>

lib_deps =
  lvgl/lvgl@8.4.0
  bblanchon/ArduinoJson@^7